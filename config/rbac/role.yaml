---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - devops.devops.mcloud
  resources:
  - mclouds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devops.devops.mcloud
  resources:
  - mclouds/finalizers
  verbs:
  - update
- apiGroups:
  - devops.devops.mcloud
  resources:
  - mclouds/status
  verbs:
  - get
  - patch
  - update
